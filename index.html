<!DOCTYPE html>

      background: #fff;

      margin-right: 10px;
      font-weight: 700;
      color: #111827;
    }
    .delivery-box .icon {
      margin-right: 8px;
      font-size: 18px;
      color: gray;
    }
    .delivery-box input {
      border: none;
      outline: none;
      font-size: 16px;
      color: #374151;
      width: 200px;
    }
    .delivery-box button {
      border: none;
      background: none;
      font-size: 18px;
      color: gray;
      margin-left: 10px;
      cursor: pointer;
    }
  </style>
</head>

  </div>
